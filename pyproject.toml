[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "old-world-unit-usage"
version = "0.1.0"
description = "Warhammer The Old World unit usage pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
ow-usage = "ow_usage.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
